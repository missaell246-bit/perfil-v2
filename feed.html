    /* =====================================================
       TIEMPO RELATIVO
    ====================================================== */

    function tiempoRelativo(fechaISO) {

        if (!fechaISO) {
            return "";
        }

        const ahora =
            new Date();

        const fecha =
            new Date(fechaISO);

        const segundos =
            Math.floor(
                (ahora - fecha) / 1000
            );


        if (segundos < 60) {

            return "hace unos segundos";

        }


        if (segundos < 3600) {

            return (
                "hace " +
                Math.floor(segundos / 60) +
                " min"
            );

        }


        if (segundos < 86400) {

            return (
                "hace " +
                Math.floor(segundos / 3600) +
                " h"
            );

        }


        if (segundos < 604800) {

            return (
                "hace " +
                Math.floor(segundos / 86400) +
                " d"
            );

        }


        return fecha.toLocaleDateString(
            "es-BO"
        );

    }

        realtimeChannel =
            sb.channel(

        realtimeChannel
            .on(
                "postgres_changes",
                {

                    schema: "public",
                    table: "posts"
                },
                function () {

                    if (currentUser) {

    /* =====================================================
       CARGAR POSTS
    ====================================================== */

    async function cargarPosts() {

        if (!sb || !currentUser) {
            return;
        }


        const {
            data: posts,
            error
        } =
            await sb
                .from("posts")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .limit(50);


        if (error) {

            console.error(error);

            mostrarError(
                "No se pudieron cargar las publicaciones."
            );

            return;

        }


        if (
            !posts ||
            posts.length === 0
        ) {

            postsContainer.innerHTML = `

                <div class="empty-box">

                    <div style="
                        font-size:35px;
                        margin-bottom:10px;
                        ">
                        📝
                    </div>

                    <div class="empty-title">
                        No hay publicaciones todavía
                    </div>

                    <div class="empty-text">
                        ¡Sé el primero en compartir algo!
                    </div>

                </div>

            `;

            return;

        }


        /* ---------------------------------------------
           PERFILES
        --------------------------------------------- */

        const userIds =
            [
                ...new Set(
                    posts.map(
                        post =>
                            post.user_id
                    )
                )
            ];


        const {
            data: profiles
        } =
            await sb
                .from("profiles")
                .select("*")
                .in(
                    "id",
                    userIds
                );


        const profilesMap = {};


        if (profiles) {

            profiles.forEach(
                profile => {

                    profilesMap[
                        profile.id
                    ] = profile;

                }
            );

        }


        /* ---------------------------------------------
           LIKES
        --------------------------------------------- */

        const postIds =
            posts.map(
                post => post.id
            );


        const {
            data: likes
        } =
            await sb
                .from("likes")
                .select("*")
                .in(
                    "post_id",
                    postIds
                );


        const likesMap = {};


        if (likes) {

            likes.forEach(
                like => {

                    if (
                        !likesMap[
                            like.post_id
                        ]
                    ) {

                        likesMap[
                            like.post_id
                        ] = [];

                    }


                    likesMap[
                        like.post_id
                    ].push(like);

                }
            );

        }


        /* ---------------------------------------------
           COMENTARIOS
        --------------------------------------------- */

        const {
            data: comments
        } =
            await sb
                .from("comments")
                .select("*")
                .in(
                    "post_id",
                    postIds
                )
                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


        const commentsMap = {};

        const commentUserIds =
            new Set();


        if (comments) {

            comments.forEach(
                comment => {

                    if (
                        !commentsMap[
                            comment.post_id
                        ]
                    ) {

                        commentsMap[
                            comment.post_id
                        ] = [];

                    }


                    commentsMap[
                        comment.post_id
                    ].push(comment);


                    commentUserIds.add(
                        comment.user_id
                    );

                }
            );

        }


        const otherUserIds =
            [
                ...commentUserIds
            ]
            .filter(
                id =>
                    !profilesMap[id]
            );


        if (
            otherUserIds.length > 0
        ) {

            const {
                data: otherProfiles
            } =
                await sb
                    .from("profiles")
                    .select("*")
                    .in(
                        "id",
                        otherUserIds
                    );


            if (otherProfiles) {

                otherProfiles.forEach(
                    profile => {

                        profilesMap[
                            profile.id
                        ] = profile;

                    }
                );

            }

        }


        /* ---------------------------------------------
           ENSAMBLAR
        --------------------------------------------- */

        const postsEnsamblados =
            posts.map(
                post => ({

                    ...post,

                    profiles:
                        profilesMap[
                            post.user_id
                        ] || null,

                    likes:
                        likesMap[
                            post.id
                        ] || [],

                    comments:
                        commentsMap[
                            post.id
                        ] || []

                })
            );


        postsContainer.innerHTML =
            postsEnsamblados
                .map(
                    post =>
                        renderPost(
                            post,
                            profilesMap
                        )
                )
                .join("");


        enlazarEventosPosts();

    }

    /* =====================================================
       EVENTOS DE POSTS
    ====================================================== */

    function enlazarEventosPosts() {

        document
            .querySelectorAll(
                "article[data-post-id]"
            )
            .forEach(
                function (article) {

                    const postId =
                        Number(
                            article.dataset.postId
                        );


                    /* LIKE */

                    article
                        .querySelector(
                            ".btn-like"
                        )
                        ?.addEventListener(
                            "click",
                            function () {

                                toggleLike(
                                    postId
                                );

                            }
                        );


                    /* ELIMINAR */

                    article
                        .querySelector(
                            ".btn-eliminar"
                        )
                        ?.addEventListener(
                            "click",
                            function () {

                                eliminarPost(
                                    postId
                                );

                            }
                        );


                    /* COMENTARIOS */

                    article
                        .querySelector(
                            ".btn-toggle-comments"
                        )
                        ?.addEventListener(
                            "click",
                            function () {

                                const section =
                                    article.querySelector(
                                        ".comments-section"
                                    );


                                section
                                    .classList
                                    .toggle(
                                        "hidden"
                                    );


                                if (
                                    !section
                                        .classList
                                        .contains(
                                            "hidden"
                                        )
                                ) {

                                    setTimeout(
                                        function () {

                                            article
                                                .querySelector(
                                                    ".comment-input"
                                                )
                                                ?.focus();

                                        },
                                        50
                                    );

                                }

                            }
                        );


                    /* VER TODOS */

                    const btnVerTodos =
                        article.querySelector(
                            ".btn-ver-todos"
                        );

                    const listaNormal =
                        article.querySelector(
                            ".comments-list"
                        );

                    const listaCompleta =
                        article.querySelector(
                            ".comments-all"
                        );


                    btnVerTodos
                        ?.addEventListener(
                            "click",
                            function () {

                                if (
                                    listaNormal
                                ) {

                                    listaNormal.style.display =
                                        "none";

                                }


                                if (
                                    listaCompleta
                                ) {

                                    listaCompleta.style.display =
                                        "flex";

                                }


                                btnVerTodos.remove();

                            }
                        );


                    /* INPUT */

                    const input =
                        article.querySelector(
                            ".input-comentario"
                        );

                    const btnEnviar =
                        article.querySelector(
                            ".btn-enviar-comentario"
                        );


                    input
                        ?.addEventListener(
                            "input",
                            function () {

                                btnEnviar.disabled =
                                    !input.value.trim();

                            }
                        );


                    input
                        ?.addEventListener(
                            "keydown",
                            function (event) {

                                if (
                                    event.key === "Enter" &&
                                    !event.shiftKey &&
                                    !btnEnviar.disabled
                                ) {

                                    event.preventDefault();

                                    btnEnviar.click();

                                }

                            }
                        );


                    btnEnviar
                        ?.addEventListener(
                            "click",
                            async function () {

                                const texto =
                                    input.value.trim();


                                if (!texto) {
                                    return;
                                }


                                btnEnviar.disabled =
                                    true;


                                await agregarComentario(
                                    postId,
                                    texto
                                );

                            }
                        );


                    /* ELIMINAR COMENTARIOS */

                    article
                        .querySelectorAll(
                            ".btn-eliminar-comentario"
                        )
                        .forEach(
                            function (button) {

                                button.addEventListener(
                                    "click",
                                    function () {

                                        const elemento =
                                            button.closest(
                                                "[data-comment-id]"
                                            );


                                        if (!elemento) {
                                            return;
                                        }


                                        eliminarComentario(
                                            Number(
                                                elemento.dataset.commentId
                                            )
                                        );

                                    }
                                );

                            }
                        );

                }
            );

    }


    /* =====================================================
       LIKE
    ====================================================== */

    async function toggleLike(
        postId
    ) {

        if (!currentUser) {
            return;
        }


        const {
            data: existente
        } =
            await sb
                .from("likes")
                .select("id")
                .eq(
                    "post_id",
                    postId
                )
                .eq(
                    "user_id",
                    currentUser.id
                )
                .maybeSingle();


        if (existente) {

            await sb
                .from("likes")
                .delete()
                .eq(
                    "id",
                    existente.id
                );

        }
        else {

            const {
                error
            } =
                await sb
                    .from("likes")
                    .insert({

                        post_id:
                            postId,

                        user_id:
                            currentUser.id

                    });


            if (error) {

                console.error(error);

                mostrarToast(
                    "No se pudo dar like.",
                    true
                );

                return;

            }


            const {
                data: post
            } =
                await sb
                    .from("posts")
                    .select("user_id")
                    .eq(
                        "id",
                        postId
                    )
                    .single();


            if (
                post &&
                post.user_id !==
                currentUser.id
            ) {

                await sb
                    .from("notifications")
                    .insert({

                        user_id:
                            post.user_id,

                        actor_id:
                            currentUser.id,

                        type:
                            "like",

                        post_id:
                            postId

                    });

            }

        }


        await cargarPosts();

    }


    /* =====================================================
       ELIMINAR POST
    ====================================================== */

    async function eliminarPost(
        postId
    ) {

        if (
            !confirm(
                "¿Eliminar esta publicación?"
            )
        ) {

            return;

        }


        const {
            error
        } =
            await sb
                .from("posts")
                .delete()
                .eq(
                    "id",
                    postId
                );


        if (error) {

            console.error(error);

            mostrarToast(
                "No se pudo eliminar.",
                true
            );

            return;

        }


        mostrarToast(
            "Publicación eliminada."
        );


        await cargarPosts();

    }


    /* =====================================================
       AGREGAR COMENTARIO
    ====================================================== */

    async function agregarComentario(
        postId,
        content
    ) {

        const {
            error
        } =
            await sb
                .from("comments")
                .insert({

                    post_id:
                        postId,

                    user_id:
                        currentUser.id,

                    content:
                        content

                });


        if (error) {

            console.error(error);

            mostrarToast(
                "Error al enviar comentario.",
                true
            );

            return;

        }


        const {
            data: post
        } =
            await sb
                .from("posts")
                .select("user_id")
                .eq(
                    "id",
                    postId
                )
                .single();


        if (
            post &&
            post.user_id !==
            currentUser.id
        ) {

            await sb
                .from("notifications")
                .insert({

                    user_id:
                        post.user_id,

                    actor_id:
                        currentUser.id,

                    type:
                        "comment",

                    post_id:
                        postId

                });

        }


        await cargarPosts();

    }


    /* =====================================================
       ELIMINAR COMENTARIO
    ====================================================== */

    async function eliminarComentario(
        commentId
    ) {

        if (
            !confirm(
                "¿Eliminar este comentario?"
            )
        ) {

            return;

        }

        } =
            await sb
                .from("comments")
                .delete()
                .eq(

                );

            mostrarToast(
                "No se pudo eliminar.",
                true
            );

            return;

        }

    }


    /* =====================================================
       NOTIFICACIONES
    ====================================================== */

    async function cargarNotificaciones() {

        if (!sb || !currentUser) {
            return;
        }


        const {
            data,
            error
        } =
            await sb
                .from("notifications")
                .select("*")
                .eq(
                    "user_id",
                    currentUser.id
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .limit(30);


        if (error) {

            console.error(error);

            return;

        }


        notificaciones =
            data || [];


        await pintarNotificaciones();

    }


    /* =====================================================
       PINTAR NOTIFICACIONES
    ====================================================== */

    async function pintarNotificaciones() {

        const listEl =
            document.getElementById(
                "notif-list"
            );

        const countEl =
            document.getElementById(
                "notif-count"
            );


        const noLeidas =
            notificaciones.filter(
                notification =>
                    !notification.is_read
            );


        if (
            noLeidas.length > 0
        ) {

            countEl.textContent =
                noLeidas.length > 99
                    ? "99+"
                    : noLeidas.length;


            countEl.classList.remove(
                "hidden"
            );

        }
        else {

            countEl.classList.add(
                "hidden"
            );

        }


        if (
            notificaciones.length === 0
        ) {

            listEl.innerHTML = `

                <p style="
                    text-align:center;
                    color:#94a3b8;
                    font-size:13px;
                    padding:25px;
                    ">

                    Sin notificaciones.

                </p>

            `;

            return;

        }


        const actorIds =
            [
                ...new Set(
                    notificaciones.map(
                        notification =>
                            notification.actor_id
                    )
                )
            ];


        let perfiles = [];


        if (actorIds.length > 0) {

            const result =
                await sb
                    .from("profiles")
                    .select("*")
                    .in(
                        "id",
                        actorIds
                    );


            perfiles =
                result.data || [];

        }


        const perfilesMap = {};


        perfiles.forEach(
            profile => {

                perfilesMap[
                    profile.id
                ] = profile;

            }
        );


        listEl.innerHTML =
            notificaciones
                .map(
                    notification => {

                        const actor =
                            perfilesMap[
                                notification.actor_id
                            ] ||
                            {
                                full_name:
                                    "Usuario",

                                username:
                                    "usuario"
                            };


                        let texto = "";

                        let emoji = "🔔";


                        if (
                            notification.type ===
                            "like"
                        ) {

                            emoji = "❤️";

                            texto =
                                `<strong>${
                                    escapeHtml(
                                        actor.full_name ||
                                        actor.username
                                    )
                                }</strong>
                                le dio like a tu publicación`;

                        }
                        else if (
                            notification.type ===
                            "comment"
                        ) {

                            emoji = "💬";

                            texto =
                                `<strong>${
                                    escapeHtml(
                                        actor.full_name ||
                                        actor.username
                                    )
                                }</strong>
                                comentó en tu publicación`;

                        }
                        else if (
                            notification.type ===
                            "friend_request"
                        ) {

                            emoji = "👥";

                            texto =
                                `<strong>${
                                    escapeHtml(
                                        actor.full_name ||
                                        actor.username
                                    )
                                }</strong>
                                te envió una solicitud de amistad`;

                        }
                        else if (
                            notification.type ===
                            "friend_accepted"
                        ) {

                            emoji = "🎉";

                            texto =
                                `<strong>${
                                    escapeHtml(
                                        actor.full_name ||
                                        actor.username
                                    )
                                }</strong>
                                aceptó tu solicitud`;

                        }
                        else {

                            texto =
                                "Tienes una nueva notificación.";

                        }


                        return `

                            <div style="
                                padding:12px;
                                border-bottom:1px solid #f1f5f9;
                                ${
                                    !notification.is_read
                                    ?
                                    "background:#eff6ff;"
                                    :
                                    ""
                                }
                                ">

                                <div style="
                                    display:flex;
                                    gap:10px;
                                    align-items:flex-start;
                                    ">

                                    <div style="
                                        font-size:20px;
                                        ">
                                        ${emoji}
                                    </div>

                                    <div style="
                                        flex:1;
                                        min-width:0;
                                        ">

                                        <div style="
                                            color:#475569;
                                            font-size:12px;
                                            line-height:1.45;
                                            ">

                                            ${texto}

                                        </div>

                                        <div style="
                                            color:#94a3b8;
                                            font-size:10px;
                                            margin-top:4px;
                                            ">

                                            ${tiempoRelativo(
                                                notification.created_at
                                            )}

                                        </div>

                                    </div>

                                    ${
                                        !notification.is_read
                                        ?
                                        `
                                        <div style="
                                            width:7px;
                                            height:7px;
                                            background:#2563eb;
                                            border-radius:50%;
                                            margin-top:5px;
                                            ">
                                        </div>
                                        `
                                        :
                                        ""
                                    }

                                </div>

                            </div>

                        `;

                    }
                )
                .join("");

    }


    /* =====================================================
       EVENTOS NOTIFICACIONES
    ====================================================== */

    function enlazarNotificaciones() {

        const btn =
            document.getElementById(
                "btn-notif"
            );

        const panel =
            document.getElementById(
                "notif-panel"
            );

        const marcar =
            document.getElementById(
                "btn-marcar-leidas"
            );


        btn.addEventListener(
            "click",
            async function (event) {

                event.stopPropagation();

                panel.classList.toggle(
                    "hidden"
                );


                if (
                    !panel.classList.contains(
                        "hidden"
                    )
                ) {

                    await marcarTodasLeidas();

                }

            }
        );


        document.addEventListener(
            "click",
            function (event) {

                if (
                    !panel.contains(
                        event.target
                    ) &&
                    event.target !== btn
                ) {

                    panel.classList.add(
                        "hidden"
                    );

                }

            }
        );


        marcar.addEventListener(
            "click",
            async function (event) {

                event.stopPropagation();

                await marcarTodasLeidas();

            }
        );

    }


    /* =====================================================
       MARCAR LEÍDAS
    ====================================================== */

    async function marcarTodasLeidas() {

        const noLeidas =
            notificaciones.filter(
                notification =>
                    !notification.is_read
            );


        if (
            noLeidas.length === 0
        ) {

            return;

        }


        await sb
            .from("notifications")
            .update({
                is_read: true
            })
            .in(
                "id",
                noLeidas.map(
                    notification =>
                        notification.id
                )
            );


        notificaciones =
            notificaciones.map(
                notification => ({

                    ...notification,

                    is_read: true

                })
            );


        await pintarNotificaciones();

    }


    /* =====================================================
       IMÁGENES
    ====================================================== */

    const inputImagen =
        document.getElementById(
            "post-image"
        );

    const previewWrap =
        document.getElementById(
            "post-image-preview"
        );

    const previewImg =
        document.getElementById(
            "post-image-preview-img"
        );


    inputImagen.addEventListener(
        "change",
        function (event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                mostrarToast(
                    "Selecciona una imagen válida.",
                    true
                );

                inputImagen.value =
                    "";

                return;

            }


            if (
                file.size >
                2 * 1024 * 1024
            ) {

                mostrarToast(
                    "La imagen es demasiado grande. Máximo 2 MB.",
                    true
                );

                inputImagen.value =
                    "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function (eventReader) {

                    imagenBase64 =
                        eventReader.target.result;


                    previewImg.src =
                        imagenBase64;


                    previewWrap
                        .classList
                        .remove(
                            "hidden"
                        );

                };


            reader.readAsDataURL(
                file
            );

        }
    );


    /* =====================================================
       QUITAR IMAGEN
    ====================================================== */

    document
        .getElementById(
            "btn-quitar-imagen"
        )
        .addEventListener(
            "click",
            function () {

                imagenBase64 =
                    "";

                inputImagen.value =
                    "";

                previewImg.src =
                    "";

                previewWrap
                    .classList
                    .add(
                        "hidden"
                    );

            }
        );


    /* =====================================================
       PUBLICAR
    ====================================================== */

    document
        .getElementById(
            "btn-publicar"
        )
        .addEventListener(
            "click",
            async function () {

                if (
                    !sb ||
                    !currentUser
                ) {

                    mostrarToast(
                        "No hay una sesión activa.",
                        true
                    );

                    return;

                }


                const textarea =
                    document.getElementById(
                        "post-content"
                    );


                const content =
                    textarea.value.trim();


                if (
                    !content &&
                    !imagenBase64
                ) {

                    mostrarToast(
                        "Escribe algo o añade una imagen.",
                        true
                    );

                    return;

                }


                const button =
                    document.getElementById(
                        "btn-publicar"
                    );


                button.disabled =
                    true;

                button.textContent =
                    "Publicando...";


                try {

                    const {
                        error
                    } =
                        await sb
                            .from("posts")
                            .insert({

                                user_id:
                                    currentUser.id,

                                content:
                                    content ||
                                    " ",

                                image_url:
                                    imagenBase64 ||
                                    null

                            });


                    if (error) {

                        console.error(
                            error
                        );

                        mostrarToast(
                            "Error al publicar.",
                            true
                        );

                        return;

                    }


                    textarea.value =
                        "";

                    imagenBase64 =
                        "";

                    inputImagen.value =
                        "";

                    previewImg.src =
                        "";

                    previewWrap
                        .classList
                        .add(
                            "hidden"
                        );


                    mostrarToast(
                        "¡Publicación realizada! ✓"
                    );


                    await cargarPosts();

                }
                finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Publicar";

                }

            }
        );


    /* =====================================================
       CERRAR SESIÓN
    ====================================================== */

    document
        .getElementById(
            "btn-logout"
        )
        .addEventListener(
            "click",
            async function () {

                if (sb) {

                    await sb.auth.signOut();

                }


                window.location.href =
                    "index.html";

            }
        );


    /* =====================================================
       ACTUALIZAR NOTIFICACIONES
    ====================================================== */

    setInterval(
        async function () {

            if (
                currentUser &&
                sb
            ) {

                await cargarNotificaciones();

            }

        },
        30000
    );


    /* =====================================================
       MOSTRAR ERROR
    ====================================================== */

    function mostrarError(
        mensaje
    ) {

        postsContainer.innerHTML = `

            <div class="error-box">

                ${escapeHtml(mensaje)}

            </div>

        `;

    }


    /* =====================================================
       INICIAR
    ====================================================== */

    iniciar();


})();

</script>

</body>
</html>
