<<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aula Social 131 — Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo / Título -->
    <div class="text-center mb-6">
      <h1 class="text-4xl font-bold text-white drop-shadow-lg"> Aula 131</h1>
      <p class="text-white/80 mt-2 text-sm">hola un gusto</p>
    </div>
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8">
      <!-- Pestañas -->
      <div class="flex mb-6 bg-slate-100 rounded-lg p-1">
        <button id="tab-login" class="flex-1 py-2 rounded-md text-sm font-medium bg-white shadow text-indigo-600 transition">
          Iniciar sesión
        </button>
        <button id="tab-register" class="flex-1 py-2 rounded-md text-sm font-medium text-slate-500 transition">
          Registrarse
        </button>
      </div>
       <!-- LOGIN -->
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Correo electrónico</label>
          <input id="login-email" type="email" required placeholder="tucorreo@ejemplo.com"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Contraseña</label>
          <input id="login-password" type="password" required placeholder="••••••••"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition text-white font-medium py-2.5 rounded-lg shadow">
          Entrar
        </button>
      </form>

      <!-- REGISTRO -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Nombre completo</label>
          <input id="reg-fullname" type="text" required placeholder="Edmar Quispe"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Nombre de usuario</label>
          <input id="reg-username" type="text" required placeholder="ana_gomez"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Correo electrónico</label>
          <input id="reg-email" type="email" required placeholder="tucorreo@ejemplo.com"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Contraseña (mín. 6 caracteres)</label>
          <input id="reg-password" type="password" required minlength="6" placeholder="••••••••"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit"
          class="w-full bg-pink-600 hover:bg-pink-700 active:scale-95 transition text-white font-medium py-2.5 rounded-lg shadow">
          Crear cuenta
        </button>
      </form>
         <!-- Mensaje de estado -->
      <p id="mensaje" class="mt-4 text-center text-sm text-slate-500"></p>
    </div>

    <p class="text-center text-white/70 text-xs mt-6">
      Al continuar, aceptas nuestros términos y política de privacidad.
    </p>
  </div>

  <script>
    (function() {
      // ============================================================
      //  CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = 'https://urpkgcvlgdesdwkyhdqo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycGtnY3ZsZ2Rlc2R3a3loZHFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTA0NDEsImV4cCI6MjEwNDk4NjQ0MX0.pP3lryKAT973Bo_ke6wkQ2f3TSCsggXfsfnDniAYQ4A';
    
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
      //  REFERENCIAS DOM
      // ============================================================
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const mensajeEl = document.getElementById('mensaje');

      // ============================================================
      //  CAMBIO DE PESTAÑAS (Login <-> Registro)
      // ============================================================
      tabLogin.addEventListener('click', () => {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        tabLogin.className = 'flex-1 py-2 rounded-md text-sm font-medium bg-white shadow text-indigo-600 transition';
        tabRegister.className = 'flex-1 py-2 rounded-md text-sm font-medium text-slate-500 transition';
        mensajeEl.textContent = '';
      });

      tabRegister.addEventListener('click', () => {
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
        tabRegister.className = 'flex-1 py-2 rounded-md text-sm font-medium bg-white shadow text-pink-600 transition';
        tabLogin.className = 'flex-1 py-2 rounded-md text-sm font-medium text-slate-500 transition';
        mensajeEl.textContent = '';
      });

      // ============================================================
      //  UTILIDAD: mostrar mensajes
      // ============================================================
      function mostrarMensaje(texto, esError = false) {
        mensajeEl.textContent = texto;
        mensajeEl.className = `mt-4 text-center text-sm ${esError ? 'text-red-500' : 'text-emerald-600'}`;
      }

      // ============================================================
      //  REGISTRO DE USUARIO
      // ============================================================
      formRegister.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('reg-fullname').value.trim();
        const username = document.getElementById('reg-username').value.trim().toLowerCase();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;

        if (!fullName || !username || !email || !password) {
          mostrarMensaje('Completa todos los campos.', true);
          return;
        }

        mostrarMensaje('Creando cuenta…');

        // signUp guarda el usuario en auth.users y dispara el trigger
        // que crea automáticamente su fila en la tabla profiles.
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            data: {                    // metadatos que leerá el trigger
              username: username,
              full_name: fullName
            }
          }
        });

        if (error) {
          mostrarMensaje('Error: ' + error.message, true);
          return;
        }

        // Dependiendo de la configuración de Supabase, el usuario
        // puede necesitar confirmar su correo antes de entrar.
        if (data.user && !data.session) {
          mostrarMensaje('Cuenta creada. Revisa tu correo para confirmar.');
        } else {
          mostrarMensaje('¡Bienvenido! Redirigiendo…');
          setTimeout(() => window.location.href = 'feed.html', 1200);
        }
      });

      // ============================================================
      //  LOGIN DE USUARIO
      // ============================================================
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        mostrarMensaje('Iniciando sesión…');

        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          mostrarMensaje('Credenciales incorrectas. Intenta de nuevo.', true);
          return;
        }

        mostrarMensaje('¡Bienvenido de vuelta! Redirigiendo…');
        setTimeout(() => window.location.href = 'feed.html', 800);
      });

      // ============================================================
      //  SI YA HAY SESIÓN ACTIVA, REDIRIGIR AL FEED
      // ============================================================
      sb.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'feed.html';
      });
    })();
  </script>
</body>
</html>
