<body>

<main class="container">

  <div class="page-header">
    <h1>👥 Amigos</h1>

  <section class="search-card">

      <div class="loading">Cargando solicitudes...</div>

  </section>


  <section class="section-card">

    <div class="section-title">
      <h2>Mis amigos</h2>
      <div id="friends-count" class="counter">0</div>
    </div>

    <div id="friends-list" class="users-grid">
      <div class="loading">Cargando amigos...</div>
    </div>

  </section>


  <section class="section-card">

    <div class="section-title">
      <h2 id="users-title">Descubrir personas</h2>
      <div id="users-count" class="counter">0</div>

      <div class="loading">Cargando usuarios...</div>
    </div>

  </section>

</main>

<div id="toast" class="toast"></div>


<script>

 const SUPABASE_URL =
        "https://urpkgcvlgdesdwkyhdqo.supabase.co ";

    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycGtnY3ZsZ2Rlc2R3a3loZHFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTA0NDEsImV4cCI6MjEwNDk4NjQ0MX0.pP3lryKAT973Bo_ke6wkQ2f3TSCsggXfsfnDniAYQ4A";


  const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  let currentUser = null;

  let currentProfile = null;

  let allProfiles = [];

  let allFriendships = [];


  const toastEl = document.getElementById("toast");

  let toastTimer;


  function mostrarToast(mensaje, tipo = "success") {

    toastEl.textContent = mensaje;

    toastEl.className = "toast " + tipo + " show";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toastEl.classList.remove("show");
    }, 3000);

  }


  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text || "";

    return div.innerHTML;

  }


  function avatarHTML(profile) {

    if (profile.avatar_url) {

      return `
        <div class="avatar">
          <img
            src="${escapeHTML(profile.avatar_url)}"
            alt="Avatar"
          >
        </div>
      `;

    }


    const nombre =
      profile.full_name ||
      profile.username ||
      "U";


    return `
      <div class="avatar">
        ${escapeHTML(nombre.charAt(0).toUpperCase())}
      </div>
    `;

  }


  async function iniciar() {

    const {
      data: {
        session
      }
    } = await sb.auth.getSession();


    if (!session) {

      window.location.href = "index.html";

      return;

    }


    currentUser = session.user;

    await cargarTodo();

  }


  async function cargarTodo() {

    try {

      await Promise.all([
        cargarMiPerfil(),
        cargarAmistades(),
        cargarUsuarios()
      ]);


      renderSolicitudes();

      renderAmigos();

      renderUsuarios(allProfiles);


    } catch (error) {

      console.error(error);

      mostrarToast(
        "No se pudieron cargar los datos",
        "error"
      );

    }

  }


  async function cargarMiPerfil() {

    const {
      data,
      error
    } = await sb
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .single();


    if (error) {
      throw error;
    }


    currentProfile = data;

  }


  async function cargarAmistades() {

    const {
      data,
      error
    } = await sb
      .from("friendships")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      );


    if (error) {
      throw error;
    }


    allFriendships = data || [];

  }


  async function cargarUsuarios() {

    const {
      data,
      error
    } = await sb
      .from("profiles")
      .select("*")
      .neq("id", currentUser.id)
      .order("created_at", {
        ascending: false
      });


    if (error) {
      throw error;
    }


    allProfiles = data || [];

  }


  function obtenerRelacion(userId) {

    return allFriendships.find(friendship =>

      friendship.sender_id === userId ||
      friendship.receiver_id === userId

    );

  }


  function obtenerOtroUsuario(friendship) {

    if (friendship.sender_id === currentUser.id) {
      return friendship.receiver_id;
    }

    return friendship.sender_id;

  }


  function getProfile(userId) {

    return allProfiles.find(
      profile => profile.id === userId
    );

  }


  function userCard(profile, buttonsHTML) {

    const nombre =
      escapeHTML(
        profile.full_name || "Usuario"
      );

    const username =
      escapeHTML(
        profile.username || "usuario"
      );

    const bio =
      escapeHTML(
        profile.bio || "Sin biografía."
      );


    return `
      <article class="user-card">

        <div class="user-top">

          ${avatarHTML(profile)}

          <div class="user-info">

            <div class="user-name">
              ${nombre}
            </div>

            <div class="user-username">
              @${username}
            </div>

          </div>

        </div>

        <p class="user-bio">
          ${bio}
        </p>

        <div class="card-actions">

          ${buttonsHTML}

        </div>

      </article>
    `;

  }


  function renderSolicitudes() {

    const container =
      document.getElementById("requests-list");


    const solicitudes =
      allFriendships.filter(friendship =>

        friendship.receiver_id === currentUser.id &&
        friendship.status === "pending"

      );


    document.getElementById(
      "requests-count"
    ).textContent = solicitudes.length;


    if (!solicitudes.length) {

      container.innerHTML = `
        <div class="empty">
          No tienes solicitudes pendientes.
        </div>
      `;

      return;

    }


    container.innerHTML =
      solicitudes.map(friendship => {

        const profile =
          getProfile(friendship.sender_id);


        if (!profile) {
          return "";
        }


        return userCard(
          profile,
          `
            <button
              class="action-btn accept-btn"
              onclick="aceptarSolicitud('${friendship.id}')"
            >
              ✓ Aceptar
            </button>

            <button
              class="action-btn danger-btn"
              onclick="rechazarSolicitud('${friendship.id}')"
            >
              ✕
            </button>
          `
        );

      }).join("");

  }


  function renderAmigos() {

    const container =
      document.getElementById("friends-list");


    const amistades =
      allFriendships.filter(
        friendship =>
          friendship.status === "accepted"
      );


    document.getElementById(
      "friends-count"
    ).textContent = amistades.length;


    if (!amistades.length) {

      container.innerHTML = `
        <div class="empty">
          Aún no tienes amigos.
        </div>
      `;

      return;

    }


    container.innerHTML =
      amistades.map(friendship => {

        const otherId =
          obtenerOtroUsuario(friendship);


        const profile =
          getProfile(otherId);


        if (!profile) {
          return "";
        }


        return userCard(
          profile,
          `
            <button
              class="action-btn secondary-btn"
              onclick="irChat('${profile.id}')"
            >
              💬 Mensaje
            </button>

            <button
              class="action-btn danger-btn"
              onclick="eliminarAmigo('${friendship.id}')"
            >
              ✕
            </button>
          `
        );

      }).join("");

  }


  function renderUsuarios(users) {

    const container =
      document.getElementById("users-list");


    document.getElementById(
      "users-count"
    ).textContent = users.length;


    if (!users.length) {

      container.innerHTML = `
        <div class="empty">
          No se encontraron usuarios.
        </div>
      `;

      return;

    }


    container.innerHTML =
      users.map(profile => {

        const relation =
          obtenerRelacion(profile.id);


        let buttons = "";


        if (!relation) {

          buttons = `
            <button
              class="action-btn primary-btn"
              onclick="enviarSolicitud('${profile.id}')"
            >
              ＋ Agregar
            </button>
          `;

        } else if (
          relation.status === "accepted"
        ) {

          buttons = `
            <button
              class="action-btn secondary-btn"
              onclick="irChat('${profile.id}')"
            >
              💬 Mensaje
            </button>
          `;

        } else if (
          relation.sender_id === currentUser.id
        ) {

          buttons = `
            <button
              class="action-btn secondary-btn"
              disabled
            >
              Solicitud enviada
            </button>
          `;

        } else {

          buttons = `
            <button
              class="action-btn accept-btn"
              onclick="aceptarSolicitud('${relation.id}')"
            >
              ✓ Aceptar
            </button>
          `;

        }


        return userCard(profile, buttons);

      }).join("");

  }


  async function enviarSolicitud(receiverId) {

    try {

      const {
        error
      } = await sb
        .from("friendships")
        .insert({
          sender_id: currentUser.id,
          receiver_id: receiverId,
          status: "pending"
        });


      if (error) {
        throw error;
      }


      mostrarToast(
        "Solicitud enviada correctamente"
      );


      await cargarAmistades();

      renderSolicitudes();

      renderAmigos();

      renderUsuarios(allProfiles);


    } catch (error) {

      console.error(error);

      mostrarToast(
        error.message || "No se pudo enviar la solicitud",
        "error"
      );

    }

  }


  async function aceptarSolicitud(friendshipId) {

    try {

      const {
        error
      } = await sb
        .from("friendships")
        .update({
          status: "accepted"
        })
        .eq("id", friendshipId);


      if (error) {
        throw error;
      }


      mostrarToast(
        "Ahora son amigos 🎉"
      );


      await cargarAmistades();

      renderSolicitudes();

      renderAmigos();

      renderUsuarios(allProfiles);


    } catch (error) {

      console.error(error);

      mostrarToast(
        "No se pudo aceptar la solicitud",
        "error"
      );

    }

  }


  async function rechazarSolicitud(friendshipId) {

    try {

      const {
        error
      } = await sb
        .from("friendships")
        .delete()
        .eq("id", friendshipId);


      if (error) {
        throw error;
      }


      mostrarToast(
        "Solicitud eliminada"
      );


      await cargarAmistades();

      renderSolicitudes();

      renderAmigos();

      renderUsuarios(allProfiles);


    } catch (error) {

      console.error(error);

      mostrarToast(
        "No se pudo eliminar la solicitud",
        "error"
      );

    }

  }


  async function eliminarAmigo(friendshipId) {

    const confirmar =
      confirm(
        "¿Seguro que deseas eliminar a este amigo?"
      );


    if (!confirmar) {
      return;
    }


    try {

      const {
        error
      } = await sb
        .from("friendships")
        .delete()
        .eq("id", friendshipId);


      if (error) {
        throw error;
      }


      mostrarToast(
        "Amigo eliminado"
      );


      await cargarAmistades();

      renderSolicitudes();

      renderAmigos();

      renderUsuarios(allProfiles);


    } catch (error) {

      console.error(error);

      mostrarToast(
        "No se pudo eliminar al amigo",
        "error"
      );

    }

  }


  function irChat(userId) {

    window.location.href =
      `chat.html?user=${userId}`;

  }


  document
    .getElementById("btn-search")
    .addEventListener("click", buscarUsuarios);


  document
    .getElementById("search-input")
    .addEventListener("keydown", event => {

      if (event.key === "Enter") {
        buscarUsuarios();
      }

    });


  function buscarUsuarios() {

    const texto =
      document
        .getElementById("search-input")
        .value
        .trim()
        .toLowerCase();


    document.getElementById(
      "users-title"
    ).textContent =
      texto
        ? `Resultados para "${texto}"`
        : "Descubrir personas";


    if (!texto) {

      renderUsuarios(allProfiles);

      return;

    }


    const resultados =
      allProfiles.filter(profile => {

        const nombre =
          (profile.full_name || "")
            .toLowerCase();

        const username =
          (profile.username || "")
            .toLowerCase();


        return (
          nombre.includes(texto) ||
          username.includes(texto)
        );

      });


    renderUsuarios(resultados);

  }


  document
    .getElementById("btn-logout")
    .addEventListener("click", async () => {

      await sb.auth.signOut();

      window.location.href = "index.html";

    });


  sb.auth.onAuthStateChange(
    (event, session) => {

      if (
        event === "SIGNED_OUT" ||
        !session
      ) {

        window.location.href =
          "index.html";

      }

    }
  );


  iniciar();

</script>
